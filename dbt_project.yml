# AtmoSync dbt Project Configuration
# Repository: AtmoSync-Micro-Climate-Arbitrage-Analytics

name: 'atmosync'
version: '1.0.0'
config-version: 2

profile: 'atmosync'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  atmosync:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: DEV

    marts:
      +materialized: table
      +schema: DEV

seeds:
  atmosync:
    +schema: DEV

tests:
  +store_failures: true

quoting:
  database: false
  schema: false
  identifier: false
